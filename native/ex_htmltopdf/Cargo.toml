[package]
name = "ex_htmltopdf"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
name = "ex_htmltopdf"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.38"

# From crates.io, pinned to an exact version: upstream is pre-1.0 and changes
# rendered output between releases, so every bump is deliberate
# (UPDATE_PROCEDURE.md). `ExHtmltopdf.upstream_version/0` reads the resolved
# version from Cargo.lock.
#
# Feature notes:
#   - default = ["cli", "server", "svg"]. We need "cli": it provides
#     `Converter`, the binding entry point that runs the same option parser as
#     the CLI, the HTTP server, and the Ruby binding. Reusing it keeps one
#     option surface across every entry point (Elixir builds the option list,
#     exactly like the Ruby gem does).
#   - "svg" embeds `<img src="*.svg">`, `background-image: url(*.svg)` and
#     inline `<svg>` as vectors. Matches the CLI default and the Ruby gem.
#     ("svg-text" — glyphs for `<text>` inside an SVG — stays off, as upstream
#     defaults it: 25 extra crates.)
#   - "server" (tiny_http) is the standalone HTTP server mode. Useless inside
#     the BEAM (Plug exists) — left off.
sghtmltopdf = { version = "=0.7.0", default-features = false, features = [
    "cli",
    "svg",
] }
